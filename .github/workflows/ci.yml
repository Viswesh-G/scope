name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # read the Go version straight from go.mod so it can never drift out of sync
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install Graphviz
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Build
      run: go build -v ./...

    - name: Vet
      run: go vet ./...

    - name: Check formatting
      run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

    - name: Test
      run: go test -v ./...

    - name: Test with race detector
      run: go test -race ./...
