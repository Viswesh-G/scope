name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        # Use the latest patched Go 1.25 release for standard-library security fixes.
        go-version: '1.25.13'
        # cache Go module downloads so repeated CI runs are faster
        cache: true

    - name: Install Graphviz (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y graphviz

    - name: Install Graphviz (Windows)
      if: matrix.os == 'windows-latest'
      run: choco install graphviz -y

    - name: Build
      run: make build

    - name: Vet
      run: make vet

    - name: Check formatting (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      run: make fmt-check

    - name: Lint (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      uses: golangci/golangci-lint-action@v6
      with:
        # This version supports the Go version declared in go.mod.
        version: v1.64.8

    - name: Security scan
      run: make vuln

    - name: Test and Coverage
      run: make cover

    - name: Enforce coverage threshold (Ubuntu only)
      if: matrix.os == 'ubuntu-latest'
      # Keep a real baseline without claiming that all packages are covered.
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | tr -d '%')
        echo "Total coverage: ${COVERAGE}%"
        awk "BEGIN { if ($COVERAGE < 20) { print \"Coverage $COVERAGE% is below 20% baseline\"; exit 1 } }"

    - name: Test with race detector
      if: matrix.os == 'ubuntu-latest'
      run: make race
